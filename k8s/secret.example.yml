# Exemplo do Secret esperado pelos workloads.
# NÃO commitar valores reais — em produção ele é criado pelo workflow de deploy
# a partir dos GitHub Secrets (ver .github/workflows/deploy.yml).
#
# Criação manual:
#   kubectl -n kleros create secret generic kleros-secrets \
#     --from-literal=APP_KEY="base64:..." \
#     --from-literal=DB_USERNAME="kleros_user" \
#     ... \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: kleros-secrets
  namespace: kleros
type: Opaque
stringData:
  # Precisa ser exatamente o APP_KEY atual de /var/www/kleros/.env,
  # senão todas as sessões e dados encriptados existentes quebram.
  APP_KEY: "base64:PLACEHOLDER"

  DB_USERNAME: "kleros_user"
  DB_PASSWORD: "PLACEHOLDER"
  # Usado só pelo pod kleros-db (root do MySQL)
  MYSQL_ROOT_PASSWORD: "PLACEHOLDER"

  MAIL_USERNAME: "notificacoes@kleros.app"
  MAIL_PASSWORD: "PLACEHOLDER"

  GOOGLE_MAPS_KEY: "PLACEHOLDER"
  GOOGLE_MAPS_ID: "PLACEHOLDER"
