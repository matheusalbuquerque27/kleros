apiVersion: apps/v1
kind: Deployment
metadata:
  name: kleros-db
  namespace: kleros
  labels:
    app: kleros-db
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # Nunca dois MySQL no mesmo PVC
    type: Recreate
  selector:
    matchLabels:
      app: kleros-db
  template:
    metadata:
      labels:
        app: kleros-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: srv1158721
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            # Node tem pouca RAM livre — buffer pool enxuto
            - --innodb-buffer-pool-size=256M
            - --max-connections=100
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: kleros_db
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kleros-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: kleros-secrets
                  key: DB_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kleros-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              cpu: 800m
              memory: 768Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kleros-db-data
