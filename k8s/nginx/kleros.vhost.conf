# =================================================================
# Kleros — proxy para o cluster k3s (namespace kleros, NodePort 30311)
# TLS termina aqui; a aplicação roda em containers.
# Vhost bare-metal anterior preservado em: kleros.pre-k8s.bak
# =================================================================

upstream kleros_k8s {
    server 127.0.0.1:30311;
}

# =================================================
# HTTP -> HTTPS (domínio principal)
# =================================================
server {
    listen 80;
    listen [::]:80;
    server_name kleros.app www.kleros.app;

    return 301 https://$host$request_uri;
}

# =================================================
# HTTPS — domínio principal
# =================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kleros.app www.kleros.app;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/kleros.app-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kleros.app-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # phpMyAdmin segue no host, apontando para o MySQL do host.
    # ATENCAO: o banco vivo da aplicacao agora e o pod kleros-db.
    location /phpmyadmin {
        alias /usr/share/phpmyadmin/;
        index index.php;

        location ~ ^/phpmyadmin/(?:index\.php)?$ {
            alias /usr/share/phpmyadmin/index.php;
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /usr/share/phpmyadmin/index.php;
        }

        location ~ ^/phpmyadmin/(.+\.php)$ {
            alias /usr/share/phpmyadmin/$1;
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /usr/share/phpmyadmin/$1;
        }

        location ~* ^/phpmyadmin/(.+\.(jpg|jpeg|gif|css|png|js|ico|html|xml|txt|svg|woff|woff2|ttf|eot))$ {
            alias /usr/share/phpmyadmin/$1;
        }
    }

    location / {
        include snippets/kleros-proxy.conf;
    }
}

# =================================================
# Wildcard HTTP (*.kleros.app)
# =================================================
server {
    listen 80;
    listen [::]:80;
    server_name *.kleros.app;

    client_max_body_size 100M;

    return 301 https://$host$request_uri;
}

# =================================================
# Wildcard HTTPS (*.kleros.app)
# =================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.kleros.app;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/kleros.app-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kleros.app-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        include snippets/kleros-proxy.conf;
    }
}

# =================================================
# Catch-All HTTP — dominios personalizados de clientes
# =================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 100M;

    location / {
        include snippets/kleros-proxy.conf;
    }
}

# =================================================
# Catch-All HTTPS — dominios personalizados de clientes
# =================================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/kleros.app-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kleros.app-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        include snippets/kleros-proxy.conf;
    }
}
