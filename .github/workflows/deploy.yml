name: Deploy to Production (k3s)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  K8S_NAMESPACE: kleros

jobs:
  build-and-deploy:
    name: Build image & rollout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > /tmp/kubeconfig.yaml
          echo "KUBECONFIG=/tmp/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Create or update k8s secrets
        run: |
          kubectl create secret generic kleros-secrets \
            --namespace="$K8S_NAMESPACE" \
            --from-literal=APP_KEY="${{ secrets.APP_KEY }}" \
            --from-literal=DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --from-literal=MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}" \
            --from-literal=MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
            --from-literal=GOOGLE_MAPS_KEY="${{ secrets.GOOGLE_MAPS_KEY }}" \
            --from-literal=GOOGLE_MAPS_ID="${{ secrets.GOOGLE_MAPS_ID }}" \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Pin manifests to the image just built
        env:
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
        run: |
          # Os manifests versionados apontam para :latest. Trocar pela tag do
          # SHA ANTES do apply: se o spec chegasse a apontar para uma tag
          # inexistente, o rollout entraria em ImagePullBackOff.
          sed -i "s|image: ${IMAGE_BASE}:.*|image: ${IMAGE_BASE}:${GITHUB_SHA}|g" \
            k8s/deployment.yml k8s/worker-deployment.yml k8s/scheduler-cronjob.yml
          grep -h 'image:' k8s/deployment.yml k8s/worker-deployment.yml k8s/scheduler-cronjob.yml

      - name: Apply k8s manifests
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/pvc.yml
          kubectl apply -f k8s/db-deployment.yml
          kubectl apply -f k8s/db-service.yml
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/kleros-db --timeout=300s
          # kleros-main faz rolling update (maxUnavailable 0): o pod novo só
          # recebe tráfego depois do readiness probe, e o initContainer
          # 'migrate' roda antes disso.
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/worker-deployment.yml
          kubectl apply -f k8s/scheduler-cronjob.yml

      - name: Wait for rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/kleros-main --timeout=420s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/kleros-worker --timeout=180s

      - name: Deployment summary
        if: always()
        run: kubectl -n "$K8S_NAMESPACE" get pods -o wide || true
