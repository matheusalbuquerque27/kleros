; Kleros — configuração PHP de produção (container)

memory_limit = 512M
max_execution_time = 120

upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 40

expose_php = Off
date.timezone = UTC

; Logs vão para o stderr do container (kubectl logs)
log_errors = On
error_log = /dev/stderr
display_errors = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Código é imutável dentro da imagem — não precisa checar mtime
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
