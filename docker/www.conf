; Kleros — pool php-fpm (sobrescreve os defaults de www.conf)
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Necessário para que as env vars do ConfigMap/Secret cheguem ao PHP
clear_env = no

pm = dynamic
; Dimensionado para o limite de 1Gi do pod kleros-main
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; Logs para o stdout/stderr do container
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
